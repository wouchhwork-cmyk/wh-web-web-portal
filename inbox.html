<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Inbox · Wouchh</title>
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <header class="bar">
    <h1>Wouchh</h1>
    <span class="who">
      <span id="who"></span>
      <a href="portal.html" style="margin-left:10px">Back</a>
    </span>
  </header>

  <main>
    <!--
      TWO PANES, NOT A STACK. The list and the thread were panels one above
      the other, so opening a conversation pushed the list off the top of the
      screen and answering meant scrolling back to see who you were
      answering.
    -->
    <div class="inbox-grid">
      <aside class="inbox-aside">
      <div class="panel">
        <h2>Inbox</h2>
        <p class="hint">
          Direct messages, comment threads and mentions from every connected account, newest first.
        </p>
        <div class="actions">
          <label for="statusFilter" class="hint">Status</label>
          <select id="statusFilter">
            <option value="">All</option>
            <option value="open" selected>Open</option>
            <option value="pending">Pending</option>
            <option value="resolved">Resolved</option>
          </select>
          <label for="mineOnly" class="hint" style="margin-left:12px">
            <input type="checkbox" id="mineOnly" /> Assigned to me
          </label>
        </div>
        <div id="listMessage"></div>
        <!--
          Live or polling. The stream is an optimisation with a thirty second
          poll underneath, so a broken stream looks exactly like a working one
          that is quiet — updates still arrive, just late.
        -->
        <p class="hint"><span id="liveState">connecting</span></p>
      </div>

      <div class="panel">
        <div id="rows"></div>
        <div class="foot">
          <button class="secondary" id="loadMore" hidden>Load more</button>
        </div>
      </div>
      </aside>

      <section class="inbox-thread">
      <div class="panel" id="threadPanel" hidden>
        <h2 id="threadTitle">Conversation</h2>
        <p class="hint" id="threadMeta"></p>

        <!--
          Whether somebody is waiting for a person, and whether the assistant
          has been told to be quiet with them.

          HERE AS WELL AS ON THE CUSTOMER RECORD, because this is where the
          decision is actually made: an agent reading a conversation is the
          one who knows it needs a human, or who is about to start typing and
          wants the assistant to stop answering over them. Making them leave
          the thread to say so is how neither gets used.
        -->
        <div id="assistantState" class="assistant-state" hidden></div>

        <!--
          Handing a conversation over and closing it. Both endpoints existed from
          the start and nothing here called them, so every conversation stayed
          open and unassigned forever and the "assigned to me" filter was always
          empty — which is most of what makes a shared inbox shared.
        -->
        <div class="actions" id="threadControls" hidden>
          <span class="hint" id="assignedTo"></span>
          <span id="assignControls" hidden style="margin-left:12px">
            <select id="assignPicker" hidden></select>
            <button class="secondary" id="assignMe">Assign to me</button>
            <button class="secondary" id="unassign" hidden>Unassign</button>
          </span>
          <span id="statusControls" hidden style="margin-left:12px">
            <label for="statusPicker" class="hint">Status</label>
            <select id="statusPicker">
              <option value="open">Open</option>
              <option value="pending">Pending</option>
              <option value="resolved">Resolved</option>
              <option value="closed">Closed</option>
            </select>
          </span>
          <!--
            Repairs a gap left by a webhook that never arrived. Only on message
            threads: a comment thread has no conversations edge to re-read.
          -->
          <span id="resyncControls" hidden style="margin-left:12px">
            <button class="secondary" id="resync">Re-check with Instagram</button>
            <span class="hint" id="resyncNote"></span>
          </span>
        </div>

        <div class="foot">
          <button class="secondary" id="loadOlder" hidden>Load older messages</button>
        </div>
        <div id="messages"></div>
        <div id="replyBox" hidden>
          <!-- What the next reply will answer, when the agent picked a message. -->
          <div id="replyTargetBanner" class="hint" hidden
               style="border-left:3px solid currentColor;padding-left:8px;margin-bottom:6px"></div>
          <label for="replyBody">Reply</label>
          <textarea id="replyBody" rows="3" maxlength="5000"
                    placeholder="Type a reply…"></textarea>
          <div class="actions">
            <button id="sendReply">Send</button>
            <!--
              Writes into the box above; it does not send. The agent reads it,
              changes what they want and presses Send like any other reply.
            -->
            <button id="draftReply" class="secondary" style="margin-left:8px">Draft with AI</button>
            <label class="hint" style="margin-left:12px">
              <input type="checkbox" id="internalNote" /> Internal note (never sent)
            </label>
          </div>
          <div id="draftNote" class="hint"></div>
        </div>
        <div id="threadMessage"></div>
      </div>

      </section>
    </div>
  </main>

  <!--
    A DIALOG, NOT A PANEL FURTHER DOWN THE PAGE.
    The prompt answers a question asked AT a message — "why did it say
    this?" — and an answer that renders somewhere else makes you leave the
    conversation to read it and find your way back afterwards. `dialog`
    rather than a hand-rolled overlay: it brings Escape, focus trapping and
    a backdrop that nothing in this stylesheet has to reimplement.
  -->
  <dialog id="promptDialog" class="prompt-dialog">
    <form method="dialog" class="prompt-dialog-head">
      <div>
        <h3 id="aiPromptTitle"></h3>
        <div id="aiPromptDrift" class="hint"></div>
      </div>
      <div class="prompt-dialog-actions">
        <button type="button" class="secondary" id="aiPromptCopy">Copy</button>
        <button class="secondary" value="close">Close</button>
      </div>
    </form>
    <div class="prompt-view">
      <pre id="aiPromptBody"></pre>
    </div>
  </dialog>

  <script src="config.js"></script>
  <script src="assets/api.js"></script>
  <script src="assets/inbox.js"></script>
</body>
</html>
