<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Customers · Wouchh</title>
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <header class="bar">
    <h1>Wouchh</h1>
    <span class="who">
      <span id="who"></span>
      <a href="portal.html" style="margin-left:10px">Back</a>
    </span>
  </header>

  <main>
    <div class="panel">
      <h2>Customers</h2>
      <p class="hint">
        Everyone who has messaged or commented, most recently seen first. One person is one
        customer even when they reach you on both Facebook and Instagram.
      </p>
      <div class="actions">
        <input type="search" id="search" placeholder="Search by name" maxlength="120" />
        <button class="secondary" id="searchGo">Search</button>
      </div>
      <div id="listMessage"></div>
    </div>

    <div class="panel">
      <div id="rows"></div>
      <div class="foot">
        <button class="secondary" id="loadMore" hidden>Load more</button>
      </div>
    </div>
  </main>

  <script src="config.js"></script>
  <script src="assets/api.js"></script>
  <script src="assets/customers.js"></script>
</body>
</html>
